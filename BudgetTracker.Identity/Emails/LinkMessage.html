<h1 class="heading" style="margin:0 0 24px;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:20px;line-height:28px;font-weight:500;color:#252B27;">{{Heading}}</h1>
<p class="text" style="margin:0 0 24px;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;line-height:22px;color:#595959;">{{Body}}</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td class="button-cell" align="center" bgcolor="#51C273" style="padding:9px 24px;background-color:#51C273;border-radius:2px;text-align:center;">
      <a class="button" href="{{ButtonUrl}}" style="font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:16px;line-height:24px;color:#FFFFFF;text-decoration:none;">{{ButtonLabel}}</a>
    </td>
  </tr>
</table>
<p class="fallback" style="margin:24px 0 0;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:12px;line-height:18px;color:#78877C;">{{LinkFallback}}<br/><a class="link" href="{{ButtonUrl}}" style="color:#419F5F;word-break:break-all;">{{ButtonUrl}}</a></p>
