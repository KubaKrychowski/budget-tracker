<h1 class="heading" style="margin:0 0 24px;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:20px;line-height:28px;font-weight:500;color:#252B27;">{{Heading}}</h1>
<p class="text" style="margin:0 0 24px;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;line-height:22px;color:#595959;">{{Body}}</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td class="code-cell" align="center" bgcolor="#F7FAF8" style="padding:20px 24px;background-color:#F7FAF8;border:1px solid #D9E8DD;border-radius:8px;text-align:center;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:32px;line-height:40px;font-weight:600;letter-spacing:8px;color:#252B27;">{{Code}}</td>
  </tr>
</table>
<p class="fallback" style="margin:24px 0 0;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:12px;line-height:18px;color:#78877C;">{{CodeHint}}</p>
