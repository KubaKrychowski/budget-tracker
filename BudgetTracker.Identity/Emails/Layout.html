<!DOCTYPE html>
<html lang="{{Lang}}">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="color-scheme" content="light"/>
  <title>{{Title}}</title>
  <style>{{Css}}</style>
</head>
<body style="margin:0;padding:0;background-color:#F7FAF8;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F7FAF8">
  <tr>
    <td align="center" class="wrapper-cell">
      <table role="presentation" class="card" width="560" cellpadding="0" cellspacing="0" border="0" bgcolor="#FFFFFF">
        <tr>
          <td class="card-cell">
            <p class="brand">{{AppName}}</p>
            {{Content}}
            <div class="divider">&nbsp;</div>
            <p class="footer">{{Footer}}</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
