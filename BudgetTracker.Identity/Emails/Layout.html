<!DOCTYPE html>
<html lang="{{Lang}}">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="color-scheme" content="light"/>
  <title>{{Title}}</title>
  <style>{{Css}}</style>
</head>
<body style="margin:0;padding:0;background-color:#F7FAF8;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F7FAF8">
  <tr>
    <td align="center" class="wrapper-cell" style="padding:48px 16px;">
      <table role="presentation" class="card" width="560" cellpadding="0" cellspacing="0" border="0" bgcolor="#FFFFFF" style="width:100%;max-width:560px;background-color:#FFFFFF;border:1px solid #D9E8DD;border-radius:16px;">
        <tr>
          <td class="card-cell" style="padding:40px;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;">
            <p class="brand" style="margin:0 0 24px;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:18px;line-height:24px;font-weight:600;color:#419F5F;">{{AppName}}</p>
            {{Content}}
            <div class="divider" style="height:1px;margin:24px 0;background-color:#D9E8DD;font-size:1px;line-height:1px;">&nbsp;</div>
            <p class="footer" style="margin:0;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:12px;line-height:18px;color:#78877C;">{{Footer}}</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
