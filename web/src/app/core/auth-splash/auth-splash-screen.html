<div class="splash" role="status" aria-live="polite" aria-busy="true">
  <img class="splash__logo" src="icons/logo.svg" width="96" height="96" alt="" />
  <div class="splash__names">
    <span class="splash__title">{{ title() }}</span>
    <span class="splash__version">{{ version() }}</span>
  </div>
  <span class="splash__spinner" aria-hidden="true"></span>
  <span class="splash__message">{{ message() }}</span>
</div>
