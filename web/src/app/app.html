@if (splash.visible()) {
  <app-auth-splash [status]="splash.status()" />
}

<header class="app-header" [attr.inert]="splash.visible() ? '' : null">
  <!-- Logo prowadzi na stronę główną. Jako <a routerLink>, nie <div (click)>: link jest
       natywnie fokusowalny i reaguje na Enter, więc nie trzeba dokładać tabindex, role
       ani obsługi klawiatury, żeby dało się tu wejść bez myszy. -->
  <a routerLink="/" class="app-header__brand">
    <img class="app-header__logo" src="icons/logo.svg" width="48" height="48" alt="BudgetTracker" />
    <span class="app-header__names">
      <span class="app-header__title">{{ 'app.title' | translate }}</span>
      <span class="app-header__version">{{ 'app.version' | translate }}</span>
    </span>
  </a>

  <!-- Wyszukiwarka wraz z rozwijanym menu (historia, ostatnie ekrany, wyniki) — patrz `SearchMenu`.
       Zastąpiła `nz-autocomplete`, który znał wyłącznie akcje systemu i milczał do trzeciego znaku. -->
  <app-search-menu class="app-header__search" />

  <!-- Ikony po prawej. Podręcznik i zębatka jako <a routerLink> (to nawigacja, ma działać
       środkowym klikiem i „otwórz w nowej karcie"); terminal to <button> — otwiera panel
       w TYM samym widoku, nie zmienia trasy. -->
  <div class="app-header__icons">
    <!-- Co nowego: kropka, gdy są nieprzeczytane wydania; patrz core/changelog. -->
    <button
      type="button"
      class="app-header__icon-link app-header__whats-new app-header__icon-link--desktop"
      (click)="changelog.open(false)"
      [attr.aria-label]="'changelog.open' | translate"
      [title]="'changelog.open' | translate"
    >
      <nz-icon nzType="star" />
      @if (changelog.hasUnread()) {
        <span class="app-header__dot" [attr.aria-label]="'changelog.unread' | translate"></span>
      }
    </button>
    <!-- Podręcznik (#19): temat dobrany do bieżącego ekranu, patrz `handbookTopic` w app.ts. -->
    <a
      [routerLink]="['/handbook']"
      [queryParams]="{ topic: handbookTopic() }"
      class="app-header__icon-link"
      [attr.aria-label]="'handbook.openHandbook' | translate"
      [title]="'handbook.openHandbook' | translate"
    >
      <nz-icon nzType="read" />
    </a>
    <!-- Terminal CLI (#25): panel komend, patrz core/terminal. -->
    <button
      type="button"
      class="app-header__icon-link app-header__icon-link--desktop"
      (click)="terminal.toggle()"
      [attr.aria-label]="'terminal.openTerminal' | translate"
      [title]="'terminal.openTerminal' | translate"
    >
      <nz-icon nzType="code" />
    </button>
    <a
      routerLink="/settings"
      class="app-header__icon-link app-header__icon-link--desktop"
      [attr.aria-label]="'settings.openSettings' | translate"
      [title]="'settings.openSettings' | translate"
    >
      <nz-icon nzType="setting" />
    </a>
    <!-- Logowanie/rejestracja/hasła obsługuje BudgetTracker.Identity (Razor) — front tylko
         wywołuje wylogowanie po stronie klienta, bez własnego ekranu. -->
    <button
      type="button"
      class="app-header__icon-link app-header__icon-link--desktop"
      (click)="logout()"
      [attr.aria-label]="'auth.logout' | translate"
      [title]="'auth.logout' | translate"
    >
      <nz-icon nzType="logout" />
    </button>
  </div>
</header>

<main class="app-main" [attr.inert]="splash.visible() ? '' : null">
  <app-update-banner />
  <router-outlet />
</main>

<app-terminal />

<!-- Telefon: dolny pasek i arkusz „Więcej” przejmują ikony nagłówka (poza podręcznikiem). -->
@if (viewport.isMobile() && !splash.visible()) {
  <app-mobile-nav (logout)="logout()" />
}
