<nz-breadcrumb class="cbg__crumbs">
  <nz-breadcrumb-item>
    <a routerLink="/dashboard">{{ 'app.dashboard' | translate }}</a>
  </nz-breadcrumb-item>
  <nz-breadcrumb-item>{{ 'createBudget.title' | translate }}</nz-breadcrumb-item>
</nz-breadcrumb>

<app-page-header [title]="'createBudget.title' | translate" />

<div class="cbg__body">
  <!-- Makieta: stepper PIONOWY, po lewej, z opisem pod tytułem.
       Renderujemy jeden krok, bo tylko on ma w makiecie treść — patrz komentarz klasy. -->
  <nz-steps [nzCurrent]="0" nzDirection="vertical" nzSize="small" class="cbg__steps">
    <nz-step
      [nzTitle]="'createBudget.steps.basics.title' | translate"
      [nzDescription]="'createBudget.steps.basics.description' | translate"
    ></nz-step>
  </nz-steps>

  <section class="cbg__panel">
    @if (error(); as message) {
      <nz-alert nzType="error" [nzMessage]="message" nzShowIcon class="cbg__alert"></nz-alert>
    }

    <p class="cbg__caption">{{ 'createBudget.caption' | translate }}</p>

    <nz-spin [nzSpinning]="optionsLoading()">
      <div class="cbg__group">
        <h2 class="cbg__group-title">{{ 'createBudget.basics' | translate }}</h2>

        <!-- Makieta: etykieta po lewej, kontrolka (225 px) po prawej, wiersze co 12 px. -->
        <div class="cbg__fields">
          <div class="cbg__field">
            <label class="cbg__label" for="budget-name">
              {{ 'createBudget.name' | translate }}
            </label>
            <input
              id="budget-name"
              nz-input
              class="cbg__control"
              [ngModel]="name()"
              (ngModelChange)="name.set($event)"
              [placeholder]="'createBudget.namePlaceholder' | translate"
              maxlength="100"
            />
          </div>

          <!-- Tego pola NIE MA w makiecie — budżet ma własny bilans, a bez wartości
               początkowej nie ma od czego liczyć stanu na dany dzień. -->
          <div class="cbg__field">
            <label class="cbg__label" for="budget-balance">
              {{ 'createBudget.initialBalance' | translate }}
            </label>
            <!-- `nzId`, nie `id`: `id` wylądowałby na hoście <nz-input-number>, a nie na
                 polu w środku, więc `<label for>` wskazywałby element bez fokusu. -->
            <nz-input-number
              [nzParser]="parseAmount"
              nzId="budget-balance"
              class="cbg__control"
              [ngModel]="initialBalance()"
              (ngModelChange)="initialBalance.set($event ?? 0)"
              [nzStep]="100"
              [nzPrecision]="2"
              [nzPlaceHolder]="'createBudget.initialBalancePlaceholder' | translate"
            ></nz-input-number>
          </div>

          <div class="cbg__field">
            <label class="cbg__label" for="budget-currency">
              {{ 'createBudget.currency' | translate }}
            </label>
            <nz-select
              nzId="budget-currency"
              class="cbg__control"
              [ngModel]="currency()"
              (ngModelChange)="currency.set($event)"
            >
              @for (code of currencies(); track code) {
                <nz-option [nzValue]="code" [nzLabel]="'currencies.' + code | translate"></nz-option>
              }
            </nz-select>
          </div>
        </div>
      </div>
    </nz-spin>

    <footer class="cbg__actions">
      <!-- Makieta pokazuje „Wstecz" jako wygaszony: to pierwszy krok, nie ma dokąd wracać.
           Wyjście prowadzi przez strzałkę w nagłówku i okruszki. -->
      <button nz-button disabled>{{ 'createBudget.back' | translate }}</button>
      <button
        nz-button
        nzType="primary"
        [nzLoading]="busy()"
        [disabled]="!canFinish()"
        (click)="finish()"
      >
        {{ 'createBudget.finish' | translate }}
      </button>
    </footer>
  </section>
</div>
