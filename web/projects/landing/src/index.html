  <!--
    Open Graph — link do tej strony będzie wklejany na Slacka i LinkedIna, a bez tych

    je względem adresu strony; część czytników RSS i starszych botów wymaga absolutnych —
    po wyborze domeny zamień na pełne URL-e i dopisz `og:url`.
  -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="pl_PL" />
  <meta property="og:title" content="Wydatki.pl — osobisty tracker wydatków z kategoryzacją ML" />
  <meta
    property="og:description"
    content="Import CSV z banku, kategoryzacja regułami i modelem ML, dashboard, który zostaje. Projekt jednoosobowy, opisany bez obietnic, których kod nie spełnia."
  />
  <meta property="og:image" content="og-cover.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Dashboard aplikacji Wydatki.pl z podziałem wydatków na kategorie." />

  <!--
    ⚠️ Adres tymczasowy — po podpięciu własnej domeny podmień go TUTAJ, w `robots.txt` i w `sitemap.xml`,
    i przy okazji zamień względne ścieżki Open Graph wyżej na bezwzględne oraz dopisz `og:url`.
    Bez `canonical` strona osiągalna pod kilkoma adresami dzieli między nie swoją wartość w wyszukiwarce.
  -->
  <link rel="canonical" href="https://victorious-coast-0553a8e03.4.azurestaticapps.net/" />

  <!-- Ten sam plik co znak w nagłówku strony — jedna grafika, dwa użycia. -->

  <link rel="alternate icon" href="favicon.ico" />

  <!--
    Dane strukturalne. ⚠️ Opisują WYŁĄCZNIE to, co da się sprawdzić na stronie — bez ocen, liczby
    użytkowników i innych pól, które wyszukiwarka pokazałaby jako fakt, a których nikt nie zmierzył.
    Ta sama zasada co w treści strony: żadnej obietnicy, której kod nie spełnia.
