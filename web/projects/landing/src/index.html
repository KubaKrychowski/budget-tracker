<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Wydatki.com — osobisty tracker wydatków z kategoryzacją ML</title>
  <meta
    name="description"
    content="Import CSV z banku, kategoryzacja regułami i modelem ML, dashboard, który zostaje. Projekt jednoosobowy, opisany bez obietnic, których kod nie spełnia."
  />

  <!--
    Open Graph — link do tej strony będzie wklejany na Slacka i LinkedIna, a bez tych znaczników
    scraper pokazuje goły adres.

    ⚠️ Ścieżki są BEZWZGLĘDNE. Były względne, dopóki domena nie była wybrana — Slack i LinkedIn
    rozwijały je same, ale część czytników i starszych botów tego nie robi i pokazywała link bez
    obrazka. Po podpięciu `wydatki.com` nie ma już powodu na ten kompromis.
  -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="pl_PL" />
  <meta property="og:url" content="https://wydatki.com/" />
  <meta property="og:title" content="Wydatki.com — osobisty tracker wydatków z kategoryzacją ML" />
  <meta
    property="og:description"
    content="Import CSV z banku, kategoryzacja regułami i modelem ML, dashboard, który zostaje. Projekt jednoosobowy, opisany bez obietnic, których kod nie spełnia."
  />
  <meta property="og:image" content="https://wydatki.com/og-cover.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Dashboard aplikacji Wydatki.com z podziałem wydatków na kategorie." />
  <meta name="twitter:card" content="summary_large_image" />

  <!--
    ⚠️ Bez `canonical` strona osiągalna pod kilkoma adresami dzieli między nie swoją wartość w wyszukiwarce.
  -->
  <link rel="canonical" href="https://wydatki.com/" />

  <!-- Ten sam plik co znak w nagłówku strony — jedna grafika, dwa użycia. -->
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="alternate icon" href="favicon.ico" />

  <!--
    Dane strukturalne. ⚠️ Opisują WYŁĄCZNIE to, co da się sprawdzić na stronie — bez ocen, liczby
    użytkowników i innych pól, które wyszukiwarka pokazałaby jako fakt, a których nikt nie zmierzył.
    Ta sama zasada co w treści strony: żadnej obietnicy, której kod nie spełnia.
  -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Wydatki.com",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web",
      "inLanguage": "pl",
      "description": "Osobisty tracker wydatków: import CSV z banku, kategoryzacja regułami i modelem ML, dashboard, limity, cele oszczędzania i zlecenia. Instalacja dla jednej osoby.",
      "isAccessibleForFree": true,
      "author": {
        "@type": "Person",
        "name": "Kuba"
      },
      "codeRepository": "https://github.com/KubaKrychowski/budget-tracker"
    }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
