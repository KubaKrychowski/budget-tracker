name: Front (aplikacja)

# Static Web Apps w planie Free nie ma "linked backend", wiec front wola API miedzy originami przez CORS.
# Adres frontu trafia do ustawien API w Terraformie (Cors__Origins__0) - po zmianie adresu SWA trzeba
# puscic `terraform apply`, inaczej przegladarka odrzuci kazde zadanie.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '!web/projects/landing/**'
      - '.github/workflows/deploy-front.yml'
  workflow_dispatch:

concurrency:
  group: deploy-front
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # Testy przed wdrozeniem, nie po. Bramka jakosci z CLAUDE.md.
      - run: npx ng test web --watch=false
        working-directory: web

      - run: npx ng build web --configuration production
        working-directory: web

      # Adresy backendow wchodza do paczki PO buildzie, przez config.json - patrz core/runtime-config.ts.
      # Inaczej trzeba by budowac osobno na kazde srodowisko, a host Static Web Apps ma losowy czlon,
      # wiec w chwili buildu nie da sie go znac.
      # Wartosci to zwykle zmienne repozytorium (Settings -> Variables), nie sekrety - to publiczne adresy.
      - name: Adresy backendow do config.json
        env:
          IDENTITY_URL: ${{ vars.IDENTITY_URL }}
          API_URL: ${{ vars.API_URL }}
        run: |
          # ⚠️ Czyscimy wartosci ze znakow sterujacych i bialych znakow na koncach. Zmienna wklejona
          # w portalu GitHuba potrafi przyniesc znak nowej linii albo powrot karetki, a taki znak wewnatrz
          # literalu w JSON-ie jest niedozwolony: przegladarka wywala sie wtedy na
          # "Bad control character in string literal in JSON", aplikacja nie startuje, a plik w portalu
          # wyglada normalnie.
          IDENTITY_URL=$(printf '%s' "$IDENTITY_URL" | tr -d '[:cntrl:]' | xargs)
          API_URL=$(printf '%s' "$API_URL" | tr -d '[:cntrl:]' | xargs)

          test -n "$IDENTITY_URL" || { echo "Brak zmiennej repozytorium IDENTITY_URL"; exit 1; }
          test -n "$API_URL" || { echo "Brak zmiennej repozytorium API_URL"; exit 1; }

          case "$IDENTITY_URL$API_URL" in
            *'"'*|*'\'*) echo "Adres zawiera cudzyslow albo ukosnik wsteczny - to nie jest adres"; exit 1 ;;
          esac

          printf '{\n  "identityAuthority": "%s",\n  "apiBaseUrl": "%s"\n}\n' "$IDENTITY_URL" "$API_URL" \
            > web/dist/web/browser/config.json

          # Plik ma byc poprawnym JSON-em ZANIM trafi do wdrozenia, a nie dopiero u uzytkownika.
          node -e 'JSON.parse(require("fs").readFileSync("web/dist/web/browser/config.json","utf8"))'
          cat web/dist/web/browser/config.json

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_TOKEN_FRONT }}
          action: upload
          # Gotowy build, bez budowania po stronie Oryx - dlatego skip_app_build.
          app_location: web/dist/web/browser
          skip_app_build: true
