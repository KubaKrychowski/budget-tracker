name: API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Testy API wymagaja prawdziwego Postgresa (patrz api/CLAUDE.md), stad uslugowy kontener.
      #
      # ⚠️ Klasy testowe maja connection stringi WPISANE NA SZTYWNO: budget/budget_dev_only, a testy RLS
      # dodatkowo budget_app/budget_app_dev_only. Zmienna ConnectionStrings__Postgres nie ma tu nic do
      # rzeczy - kontener musi miec dokladnie te dane. Inne haslo konczy sie
      # "password authentication failed for user budget" w KAZDYM tescie, co wyglada jak awaria bazy,
      # a jest zwykla niezgodnoscia konfiguracji.
      - name: Role RLS w bazie testowej
        run: >-
          psql "postgresql://budget:budget_dev_only@localhost:5432/postgres"
          -v ON_ERROR_STOP=1
          -v app_password=budget_app_dev_only
          -f api/db/setup-rls-roles.sql

      # ⚠️ Uprawnienia nadajemy w template1, a nie w konkretnej bazie. Kazda klasa testowa zaklada
      # i kasuje WLASNA baze (TestDatabase.ResetAsync), wiec nie ma tu bazy, na ktorej dalo by sie to
      # zrobic z gory. CREATE DATABASE kopiuje template1 razem z jego katalogiem domyslnych uprawnien,
      # wiec kazda nowa baza testowa dziedziczy ALTER DEFAULT PRIVILEGES i tabele tworzone przez
      # `budget` od razu maja GRANT-y dla budget_app i budget_jobs.
      #
      # Bez tego BudgetPurger, ktory wchodzi w budget_jobs przez SET LOCAL ROLE, dostaje
      # "42501: permission denied for table Budgets" - rola istnieje, ale nie ma do czego siegnac.
      - name: Domyslne uprawnienia dla nowych baz testowych
        run: >-
          psql "postgresql://budget:budget_dev_only@localhost:5432/template1"
          -v ON_ERROR_STOP=1
          -f api/db/grant-app-privileges.sql

      - run: dotnet test api/tests/BudgetTracker.Api.Tests --configuration Release

      - run: dotnet publish api/src/BudgetTracker.Api --configuration Release --output publish

      # ⚠️ MIGRACJE PRZED WDROZENIEM KODU. API nie migruje sie samo przy starcie i ma sie nie migrowac:
      # laczy sie rola budget_app, ktora nie ma prawa do DDL - na tym polega podzial rol pod RLS.
      # Skrypt idempotentny, a nie `database update`, bo daje sie przejrzec w logu przebiegu.
      # Na pull requescie zatrzymujemy sie po testach i buildzie - wdrazamy dopiero po mergu.
      - name: Skrypt migracji
        if: github.event_name != 'pull_request'
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef migrations script --idempotent \
            --project api/src/BudgetTracker.Api \
            --output migracja.sql

      # ⚠️ Connection string WLASCICIELA bazy, nie ten, ktorym chodzi aplikacja. budget_app nie zrobi DDL.
      # Na pull requescie zatrzymujemy sie po testach i buildzie - wdrazamy dopiero po mergu.
      - name: Migracja bazy
        if: github.event_name != 'pull_request'
        env:
          PGCONN: ${{ secrets.POSTGRES_CONNECTION_OWNER }}
        run: psql "$PGCONN" -v ON_ERROR_STOP=1 -f migracja.sql

      # Na pull requescie zatrzymujemy sie po testach i buildzie - wdrazamy dopiero po mergu.
      - uses: azure/webapps-deploy@v3
        if: github.event_name != 'pull_request'
        with:
          app-name: wydatki-beta-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_API }}
          package: publish

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: budget_dev_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

      # Emulator Azure Blob Storage. TrainingSetBuilderTests i CategoryModelTrainingTests zapisuja
      # zbior uczacy i model do bloba, wiec bez niego dostaja "Connection refused (localhost:10000)".
      # Lokalnie daje go docker-compose; tutaj musi byc osobno.
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports:
          - 10000:10000
