name: Android release

# Podpisany APK do pobrania z landingu (sekcja "Aplikacja na telefon").
# Wydanie powstaje po wypchnieciu taga android-v<wersja>, np. android-v2.1:
#   git tag android-v2.1 && git push origin android-v2.1
# Landing linkuje do stalego adresu najnowszego wydania:
#   https://github.com/KubaKrychowski/budget-tracker/releases/latest/download/wydatki.apk
# Dlatego plik ZAWSZE nazywa sie wydatki.apk, a wydanie jest oznaczane jako najnowsze.

on:
  push:
    tags: ['android-v*']

concurrency:
  group: release-android
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Capacitor 8 kompiluje pod Jave 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # "Co nowego" czyta web/public/changelog.json. Tag bez wpisu o tej wersji zostawiał w aplikacji stare okno
      # (przy 2.2-2.4 nikt nie dopisal wpisow), wiec brak wpisu zatrzymuje wydanie, zanim cokolwiek sie zbuduje.
      - name: Wpis w "Co nowego"
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          node -e 'const v=process.argv[1];const l=require("./web/public/changelog.json");if(l[0]?.id!==v){console.error("::error::Najnowszy wpis w web/public/changelog.json to "+l[0]?.id+", a wydanie to "+v+". Dopisz wpis dla "+v+" na poczatku pliku.");process.exit(1)}' "$VERSION"

      - run: npm ci
        working-directory: web

      # Build "mobile" podmienia config.json na adresy produkcji (web/mobile/config.json).
      - run: npx ng build --configuration production,mobile
        working-directory: web

      - run: npx cap sync android
        working-directory: web

      # Klucz podpisu istnieje wylacznie w sekretach repozytorium. Bez niego wydanie by sie zbudowalo
      # niepodpisane, a takiego APK telefon nie zainstaluje - wiec brak sekretu ma zatrzymac workflow.
      - name: Klucz podpisu
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Brak sekretu ANDROID_KEYSTORE_B64 - patrz README, sekcja o aplikacji mobilnej."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # versionCode = numer przebiegu workflow: rosnie z kazdym wydaniem, a Android wymaga rosnacego numeru.
      - name: APK
        working-directory: web/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          ./gradlew assembleRelease -PversionName="$VERSION" -PversionCode="${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/wydatki.apk"

      - name: Wydanie
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/wydatki.apk" \
            --title "Wydatki.com ${VERSION} (Android)" \
            --notes "Aplikacja na Androida. Instalacja: pobierz wydatki.apk na telefonie i zezwol przegladarce na instalacje aplikacji. Logowanie kontem z bety." \
            --latest
