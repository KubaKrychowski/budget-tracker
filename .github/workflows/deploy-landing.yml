name: Landing

# Filtr push NIE zawiera tego pliku, a filtr pull_request tak. Zmiana samej konfiguracji CI ma
# uruchomic build na PR-ze (zeby bylo widac, czy dziala), ale NIE ma wdrazac uslugi po mergu -
# inaczej jedna poprawka w workflow wypuszcza wszystkie cztery serwisy naraz.
on:
  push:
    branches: [main]
    paths:
      - 'web/projects/landing/**'
  pull_request:
    branches: [main]
    paths:
      - 'web/projects/landing/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

concurrency:
  group: deploy-landing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # Te testy pilnuja UCZCIWOSCI strony (roadmapa, sekcja o granicach, jedno CTA) - patrz app.spec.ts.
      # Dlatego blokuja wdrozenie zamiast byc informacyjne.
      # Tylko na PR-ze: po mergu testy juz przeszly na tym samym kodzie, a runner F1 i tak czeka.
      - run: npx ng test landing --watch=false
        if: github.event_name == 'pull_request'
        working-directory: web

      - run: npx ng build landing --configuration production
        working-directory: web

      # Na pull requescie zatrzymujemy sie po testach i buildzie - wdrazamy dopiero po mergu.
      - uses: Azure/static-web-apps-deploy@v1
        if: github.event_name != 'pull_request'
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_TOKEN_LANDING }}
          action: upload
          app_location: web/dist/landing/browser
          skip_app_build: true
