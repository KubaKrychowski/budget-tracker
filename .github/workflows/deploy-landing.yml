name: Landing

on:
  push:
    branches: [main]
    paths:
      - 'web/projects/landing/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # Te testy pilnuja UCZCIWOSCI strony (roadmapa, sekcja o granicach, jedno CTA) - patrz app.spec.ts.
      # Dlatego blokuja wdrozenie zamiast byc informacyjne.
      - run: npx ng test landing --watch=false --browsers=ChromeHeadless
        working-directory: web

      - run: npx ng build landing --configuration production
        working-directory: web

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_TOKEN_LANDING }}
          action: upload
          app_location: web/dist/landing/browser
          skip_app_build: true
